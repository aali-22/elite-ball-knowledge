[project]
name = "elite-ball-knowledge-api"
version = "0.1.0"
description = "The read-only API behind Elite Ball Knowledge"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "tzdata",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools]
packages = ["ebk", "insights", "schemas", "tactics"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
